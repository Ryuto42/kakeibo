<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <title>家計簿</title>
        <link rel="icon" href="icon.png" type="image/png">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <link rel="stylesheet" href="style.css">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="家計簿">

        <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
        <meta name="theme-color" content="#000000">
        <link rel="apple-touch-icon" href="icon.png">
    </head>
    <body>
        <div class="topbar">
            <h1 id="screen-title">ホーム</h1>
            <div id="sync-status" class="sync-status">更新中…</div>
            <div class="seg seg-mini" id="cal-seg">
                <button class="seg-btn active" id="btn-cal-month" onclick="setCalendarMode('month')">月</button>
                <button class="seg-btn" id="btn-cal-year" onclick="setCalendarMode('year')">年</button>
            </div>
        </div>

        <div id="loader">読み込み中…</div>

        <div id="main-content" style="display:none;">

            <!-- ホーム -->
            <section id="screen-home" class="screen">
                <button class="balance-card tappable" onclick="showScreen('assets')">
                    <span class="balance-label">現在の資産残高</span>
                    <span class="balance-value" id="home-balance">¥0</span>
                    <span class="balance-sub" id="home-balance-sub"></span>
                    <i class="fa-solid fa-chevron-right balance-chevron"></i>
                </button>

                <div class="section-head" id="home-month-head">今月の収支</div>
                <div class="month-summary">
                    <div class="ms-row">
                        <button class="ms-item" onclick="showMonthBreakdown('収入')">
                            <span class="ms-label">収入</span>
                            <span class="ms-value val-income" id="home-income">¥0</span>
                        </button>
                        <button class="ms-item" onclick="showMonthBreakdown('支出')">
                            <span class="ms-label">支出</span>
                            <span class="ms-value val-expense" id="home-expense">¥0</span>
                        </button>
                    </div>
                    <button class="ms-net" onclick="showMonthBreakdown('net')">
                        <span class="ms-label">収支</span>
                        <span class="ms-net-right">
                            <span class="ms-value" id="home-net">¥0</span>
                            <i class="fa-solid fa-chevron-right ms-chevron"></i>
                        </span>
                    </button>
                </div>

                <div class="section-head">最近の入出履歴</div>
                <div class="list-card">
                    <div id="home-history"></div>
                    <div class="acc-body" id="history-body">
                        <div id="home-history-more"></div>
                    </div>
                    <button class="list-more" id="history-toggle" onclick="toggleHistory()">
                        <span id="history-more-label"></span>
                        <i class="fa-solid fa-chevron-down acc-icon"></i>
                    </button>
                </div>
            </section>

            <!-- 家計簿 -->
            <section id="screen-kakeibo" class="screen">
                <div class="date-nav no-scrollbar" id="date-nav"></div>

                <div class="seg">
                    <button class="seg-btn active" id="btn-expense" onclick="switchTab('支出')">支出</button>
                    <button class="seg-btn" id="btn-income" onclick="switchTab('収入')">収入</button>
                </div>

                <div class="dashboard">
                    <div class="chart-area"><canvas id="doughnutChart"></canvas></div>
                    <div class="stats">
                        <div class="stat-row">
                            <div class="stat-label">収入</div>
                            <div class="stat-value val-income" id="total-income">¥0</div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-label">支出</div>
                            <div class="stat-value val-expense" id="total-expense">¥0</div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-label">収支</div>
                            <div class="stat-value" id="total-balance">¥0</div>
                            <div class="stat-diff" id="diff-balance"></div>
                        </div>
                    </div>
                </div>

                <div id="category-list-container"></div>

                <div class="card card-mt">
                    <div class="card-title">月次の収支推移</div>
                    <div class="bar-chart-area"><canvas id="monthlyBarChart"></canvas></div>
                </div>
            </section>

            <!-- 資産 -->
            <section id="screen-assets" class="screen">
                <div class="balance-card">
                    <div class="balance-label">現在の資産残高</div>
                    <div class="balance-value" id="assets-balance">¥0</div>
                    <div class="balance-sub" id="assets-balance-sub"></div>
                </div>

                <div class="card">
                    <div class="card-title">資産推移</div>
                    <div class="seg seg-sm" id="range-seg">
                        <button class="seg-btn" data-range="1m" onclick="setAssetRange('1m')">1ヶ月</button>
                        <button class="seg-btn" data-range="3m" onclick="setAssetRange('3m')">3ヶ月</button>
                        <button class="seg-btn active" data-range="1y" onclick="setAssetRange('1y')">1年</button>
                        <button class="seg-btn" data-range="all" onclick="setAssetRange('all')">全期間</button>
                    </div>
                    <div class="chart-frame">
                        <div class="scroll-x no-scrollbar" id="trendScrollContainer">
                            <div class="chart-track" id="chartTrack">
                                <div class="chart-inner" id="lineChartWrapper">
                                    <canvas id="lineChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 目標 -->
            <section id="screen-goal" class="screen">
                <div class="balance-card">
                    <div class="balance-label">現在の資産残高</div>
                    <div class="balance-value" id="goal-balance">¥0</div>
                    <div class="balance-sub" id="goal-progress-text">目標を設定してください</div>
                    <div class="progress"><div class="progress-bar" id="goal-progress-bar"></div></div>
                </div>

                <div class="card">
                    <div class="card-title">目標の設定</div>
                    <label class="field">
                        <span class="field-label">目標金額</span>
                        <input class="field-input" type="number" id="goal-amount"
                               inputmode="numeric" placeholder="1000000">
                    </label>
                    <label class="field">
                        <span class="field-label">達成したい時期</span>
                        <input class="field-input" type="month" id="goal-month">
                    </label>
                </div>

                <div id="goal-result"></div>
            </section>

        </div>

        <!-- カテゴリ詳細（ポップアップ） -->
        <div class="sheet-backdrop" id="detail-sheet" onclick="onSheetBackdrop(event)">
            <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="detail-category-title">
                <div class="sheet-handle"></div>
                <div class="sheet-head">
                    <span class="sheet-title" id="detail-category-title"></span>
                    <button class="sheet-close" onclick="closeDetailView()" aria-label="閉じる">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="sheet-body" id="detail-list-content"></div>
                <div class="sheet-foot" id="sheet-foot"></div>
            </div>
        </div>

        <nav class="tabbar">
            <div class="tabbar-pill">
                <div class="tab-indicator" id="tab-indicator"><div class="tab-capsule" id="tab-capsule"></div></div>
                <button class="tab-btn active" data-tab="home" onclick="showScreen('home')" aria-label="ホーム">
                    <i class="fa-solid fa-house"></i>
                </button>
                <button class="tab-btn" data-tab="kakeibo" onclick="showScreen('kakeibo')" aria-label="家計簿">
                    <i class="fa-solid fa-chart-pie"></i>
                </button>
                <button class="tab-btn" data-tab="assets" onclick="showScreen('assets')" aria-label="資産">
                    <i class="fa-solid fa-chart-line"></i>
                </button>
                <button class="tab-btn" data-tab="goal" onclick="showScreen('goal')" aria-label="目標">
                    <i class="fa-solid fa-bullseye"></i>
                </button>
            </div>
        </nav>

        <script>
        //GAS
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwkyLkvVHwzil-hyINxabWDKX_VLxRNhmSeNMxX6lSlEFjx60uU-KfSBK51PGRqw8C4Uw/exec";

        const INITIAL_BALANCE = 163810;
        const CACHE_KEY = 'kakeibo_cache_v1';

        const SCREEN_TITLES = { home: 'ホーム', kakeibo: '家計簿', assets: '資産', goal: '目標' };
        const TAB_ORDER = ['home', 'kakeibo', 'assets', 'goal'];
        const SCREENS = ['home', 'kakeibo', 'assets', 'goal'];
        const GOAL_KEY = 'kakeibo_goal_v1';
        // 収支のブレが大きいので、ペースは直近12ヶ月の平均で見る
        const PACE_MONTHS = 12;

        let globalData = [];
        let currentScreen = 'home';
        let calendarMode = 'month';
        let currentTab = '支出';
        let currentSelection = '';
        let currentCategories = [];
        let currentDetailCategory = '';
        let sheetContext = null;
        let assetRange = '1y';
        let assetSeries = { labels: [], values: [] };
        let assetVisible = 0;
        let assetWindowStart = 0;
        let trendScrollRaf = null;
        let historyOpen = false;

        let doughnutChart = null;
        let lineChart = null;
        let monthlyBarChart = null;
        let monthList = [];
        let yearList = [];

        const categoryPalette = [
            '#ff9f0a', '#5e5ce6', '#64d2ff', '#bf5af2',
            '#ff375f', '#ffd60a', '#66d4cf', '#ac8e68'
        ];

        function formatDateYM(date) {
            const y = date.getFullYear();
            const m = ('0' + (date.getMonth() + 1)).slice(-2);
            return `${y}/${m}`;
        }

        function yen(v) { return '¥' + v.toLocaleString(); }

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        /* データ取得 */

        window.onload = function () {
            startApp();
        };

        async function startApp() {
            const cachedStr = localStorage.getItem(CACHE_KEY);
            if (cachedStr) {
                try {
                    const cachedData = JSON.parse(cachedStr);
                    if (Array.isArray(cachedData) && cachedData.length > 0) {
                        applyData(cachedData);
                        document.getElementById('sync-status').classList.add('show');
                    }
                } catch (e) {}
            }
            try {
                const response = await fetch(GAS_API_URL);
                const newData = await response.json();
                onServerDataLoaded(newData);
            } catch (error) {
                console.error('通信エラー:', error);
                document.getElementById('sync-status').classList.remove('show');
                if (globalData.length === 0) {
                    document.getElementById('loader').innerHTML =
                        'データの取得に失敗しました。<br>通信環境を確認してください。';
                }
            }
        }

        function onServerDataLoaded(newData) {
            document.getElementById('sync-status').classList.remove('show');
            if (!Array.isArray(newData)) return;

            const newStr = JSON.stringify(newData);
            const cachedStr = localStorage.getItem(CACHE_KEY);
            localStorage.setItem(CACHE_KEY, newStr);

            if (cachedStr === newStr && globalData.length > 0) {
                document.getElementById('loader').style.display = 'none';
                return;
            }
            applyData(newData);
        }

        function applyData(data) {
            globalData = data;
            extractDates();

            const list = (calendarMode === 'month') ? monthList : yearList;
            if (!currentSelection || !list.includes(currentSelection)) {
                currentSelection = list.length > 0 ? list[list.length - 1] : '';
                if (!currentSelection) {
                    const now = new Date();
                    currentSelection = (calendarMode === 'month')
                        ? formatDateYM(now) : now.getFullYear().toString();
                }
            }

            document.getElementById('loader').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            renderCurrentScreen();
        }

        function extractDates() {
            const uniqueMonths = new Set();
            const uniqueYears = new Set();
            globalData.forEach(d => {
                if (!d || !d.date) return;
                uniqueMonths.add(d.date.substring(0, 7));
                uniqueYears.add(d.date.substring(0, 4));
            });
            monthList = Array.from(uniqueMonths).sort();
            yearList = Array.from(uniqueYears).sort();
        }

        /* 画面切り替え */

        function showScreen(name) {
            const changed = currentScreen !== name;
            closeDetailView();
            currentScreen = name;

            SCREENS.forEach(s => {
                const el = document.getElementById('screen-' + s);
                el.classList.toggle('active', s === name);
                if (s === name) {
                    el.classList.remove('fade-in-view');
                    void el.offsetWidth;
                    el.classList.add('fade-in-view');
                }
            });

            document.getElementById('screen-title').textContent = SCREEN_TITLES[name];
            document.getElementById('cal-seg').style.display = (name === 'kakeibo') ? 'flex' : 'none';
            updateTabBar(changed);
            window.scrollTo({ top: 0, behavior: 'auto' });
            renderCurrentScreen();
        }

        function updateTabBar(animateCapsule) {
            const activeTab = currentScreen;
            const index = Math.max(0, TAB_ORDER.indexOf(activeTab));

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === activeTab);
            });

            document.getElementById('tab-indicator').style.transform =
                `translateX(${index * 100}%)`;

            if (animateCapsule) {
                const capsule = document.getElementById('tab-capsule');
                capsule.classList.remove('is-morphing');
                void capsule.offsetWidth;
                capsule.classList.add('is-morphing');
            }
        }

        function renderCurrentScreen() {
            if (globalData.length === 0 && !localStorage.getItem(CACHE_KEY)) return;
            if (currentScreen === 'home') renderHome();
            else if (currentScreen === 'kakeibo') renderKakeibo();
            else if (currentScreen === 'assets') renderAssets();
            else if (currentScreen === 'goal') renderGoal();
            // ポップアップを開いたままデータが更新された場合も中身を追従させる
            if (isDetailOpen()) refreshSheet();
        }

        /* 共通計算 */

        function sortedByDate(asc = true) {
            return [...globalData].sort((a, b) =>
                asc ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
        }

        function buildDailyBalanceSeries() {
            const sorted = sortedByDate(true);
            let balance = INITIAL_BALANCE;
            const labels = [];
            const values = [];
            let lastDate = null;

            sorted.forEach(d => {
                if (d.type === '収入') balance += d.amount;
                else if (d.type === '支出') balance -= d.amount;

                if (d.date === lastDate) {
                    values[values.length - 1] = balance;
                } else {
                    labels.push(d.date);
                    values.push(balance);
                    lastDate = d.date;
                }
            });
            return { labels, values };
        }

        function currentBalance() {
            const series = buildDailyBalanceSeries();
            return series.values.length ? series.values[series.values.length - 1] : INITIAL_BALANCE;
        }

        function periodTotals(key) {
            let income = 0, expense = 0, count = 0;
            globalData.forEach(d => {
                if (!d.date || !d.date.startsWith(key)) return;
                count++;
                if (d.type === '収入') income += d.amount;
                else if (d.type === '支出') expense += d.amount;
            });
            return { income, expense, net: income - expense, count };
        }

        function animateValue(id, start, end, duration, formatFn) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const eased = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                const value = Math.floor(start + (end - start) * eased);
                obj.textContent = formatFn ? formatFn(value) : value;
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function getColorForCategory(name, index, tab) {
            tab = tab || currentTab;
            if (name.includes('未分類') || name.includes('その他')) return '#8e8e93';
            if (tab === '収入') {
                if (name.includes('給与')) return '#30d158';
                if (name.includes('立て替え') || name.includes('立替')) return '#64d2ff';
                return '#8e8e93';
            }
            if (name.includes('現金') || name.includes('カード')) return '#ff453a';
            if (name.includes('税')) return '#8e8e93';
            return categoryPalette[index % categoryPalette.length];
        }

        function groupByCategory(rows, tab) {
            const group = {};
            rows.forEach(d => {
                const parts = d.category ? d.category.split('/') : ['未分類', 'その他'];
                let mainCat = parts[0].trim();
                let subCat = parts.length > 1 ? parts[1].trim() : 'その他';
                if (tab === '収入') { mainCat = subCat; subCat = '-'; }

                if (!group[mainCat]) group[mainCat] = { total: 0, subs: {} };
                group[mainCat].total += d.amount;
                if (subCat !== '-') {
                    group[mainCat].subs[subCat] = (group[mainCat].subs[subCat] || 0) + d.amount;
                }
            });
            return Object.keys(group)
                .map(key => ({ name: key, data: group[key] }))
                .sort((a, b) => b.data.total - a.data.total);
        }

        function makeDoughnut(canvasId, labels, data, colors) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || !canvas.offsetParent) return null;

            let isEmpty = false;
            if (data.length === 0) {
                labels = ['データなし']; data = [1]; colors = ['#2c2c2e']; isEmpty = true;
            }

            return new Chart(canvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 0,
                        borderRadius: isEmpty ? 0 : 4,
                        spacing: data.length > 1 ? 2 : 0,
                        hoverOffset: 6
                    }]
                },
                options: {
                    cutout: '72%',
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { animateScale: true, animateRotate: true, duration: 800, easing: 'easeOutQuart' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            enabled: !isEmpty,
                            backgroundColor: 'rgba(28,28,30,0.96)',
                            bodyColor: '#ffffff',
                            titleColor: '#98989f',
                            borderColor: 'rgba(255,255,255,0.12)',
                            borderWidth: 1,
                            padding: 10, cornerRadius: 10, displayColors: false,
                            callbacks: { label: (c) => ' ' + yen(c.raw) }
                        }
                    }
                }
            });
        }

        function getIconClass(name) {
            if (name.includes('現金') || name.includes('カード')) return 'fa-wallet';
            if (name.includes('税') || name.includes('保険')) return 'fa-file-invoice-dollar';
            if (name.includes('食')) return 'fa-utensils';
            if (name.includes('交通')) return 'fa-train';
            if (name.includes('住')) return 'fa-house';
            if (name.includes('給与')) return 'fa-money-bill-wave';
            if (name.includes('その他入金') || name.includes('収入')) return 'fa-coins';
            return 'fa-shapes';
        }

        /* ホーム */

        function renderHome() {
            const balance = currentBalance();
            animateValue('home-balance', 0, balance, 800, yen);

            const sortedDesc = sortedByDate(false);
            const lastDate = sortedDesc.length ? sortedDesc[0].date : null;
            document.getElementById('home-balance-sub').textContent =
                lastDate ? `最終記録 ${lastDate}` : '記録がありません';

            const latestMonth = monthList.length ? monthList[monthList.length - 1] : formatDateYM(new Date());
            const parts = latestMonth.split('/');
            document.getElementById('home-month-head').textContent =
                `${parts[0]}年${Number(parts[1])}月の収支`;

            const totals = periodTotals(latestMonth);
            animateValue('home-income', 0, totals.income, 800, yen);
            animateValue('home-expense', 0, totals.expense, 800, yen);
            animateValue('home-net', 0, totals.net, 800, yen);
            document.getElementById('home-net').style.color =
                totals.net >= 0 ? 'var(--net-plus)' : 'var(--net-minus)';

            const rows = sortedDesc.slice(0, 30);
            const listEl = document.getElementById('home-history');
            const moreEl = document.getElementById('home-history-more');
            const toggleEl = document.getElementById('history-toggle');

            if (rows.length === 0) {
                listEl.innerHTML = '<div class="no-data">データがありません</div>';
                moreEl.innerHTML = '';
                toggleEl.style.display = 'none';
                return;
            }

            // 先頭5件は常に表示し、残りはアコーディオンで開く
            listEl.innerHTML = rows.slice(0, 5).map(txRowHtml).join('');
            const rest = rows.slice(5);
            moreEl.innerHTML = rest.map(txRowHtml).join('');
            toggleEl.style.display = rest.length ? 'flex' : 'none';
            updateHistoryToggleLabel(rest.length);
        }

        function txRowHtml(d, i) {
            const isIncome = d.type === '収入';
            const sign = isIncome ? '+' : '-';
            const color = isIncome ? 'var(--income)' : 'var(--expense)';
            const cat = d.category ? d.category.replace('/', ' / ') : '未分類';
            return `
                <div class="tx-row" style="animation-delay:${(i * 0.02).toFixed(2)}s">
                    <div class="tx-main">
                        <div class="tx-desc">${escapeHtml(d.description)}</div>
                        <div class="tx-meta">${escapeHtml(d.date)} · ${escapeHtml(cat)}</div>
                    </div>
                    <div class="tx-amount" style="color:${color}">${sign}${yen(d.amount)}</div>
                </div>`;
        }

        function updateHistoryToggleLabel(restCount) {
            document.getElementById('history-more-label').textContent =
                historyOpen ? '閉じる' : `さらに${restCount}件を表示`;
        }

        function toggleHistory() {
            historyOpen = !historyOpen;
            document.getElementById('history-body').classList.toggle('open', historyOpen);
            document.getElementById('history-toggle').classList.toggle('open', historyOpen);
            updateHistoryToggleLabel(document.getElementById('home-history-more').childElementCount);
        }

        /* 家計簿 */

        function renderKakeibo() {
            document.getElementById('btn-cal-month').classList.toggle('active', calendarMode === 'month');
            document.getElementById('btn-cal-year').classList.toggle('active', calendarMode === 'year');
            document.getElementById('btn-expense').classList.toggle('active', currentTab === '支出');
            document.getElementById('btn-income').classList.toggle('active', currentTab === '収入');
            renderNav();
            renderSummaryData();
            renderMonthlyBars();
        }

        function monthlyWindow(count) {
            if (monthList.length === 0) return { months: [], selected: -1 };

            let idx = -1;
            if (calendarMode === 'month') {
                idx = monthList.indexOf(currentSelection);
            } else {
                // 年で見ているときはその年の最後の月に合わせる
                monthList.forEach((m, i) => { if (m.startsWith(currentSelection)) idx = i; });
            }
            if (idx < 0) idx = monthList.length - 1;

            let start = idx - Math.floor(count / 2);
            start = Math.min(start, monthList.length - count);
            start = Math.max(0, start);
            return { months: monthList.slice(start, start + count), selected: idx - start };
        }

        function renderMonthlyBars() {
            const canvas = document.getElementById('monthlyBarChart');
            if (!canvas || !canvas.offsetParent) return;

            const win = monthlyWindow(12);
            const months = win.months;
            const selected = win.selected;
            if (monthlyBarChart) { monthlyBarChart.destroy(); monthlyBarChart = null; }
            if (months.length === 0) return;

            const rows = months.map(m => periodTotals(m));
            const labels = months.map(m => {
                const p = m.split('/');
                return Number(p[1]) === 1 ? `${p[0].slice(2)}/1` : `${Number(p[1])}`;
            });
            // 選択中の月だけ濃く塗って位置が分かるようにする
            const shade = (rgb) => months.map((m, i) =>
                `rgba(${rgb},${i === selected ? 0.95 : 0.35})`);

            monthlyBarChart = new Chart(canvas.getContext('2d'), {
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'bar', label: '収入', data: rows.map(r => r.income),
                            backgroundColor: shade('48,209,88'), borderRadius: 3,
                            categoryPercentage: 0.7, barPercentage: 0.9, order: 2
                        },
                        {
                            type: 'bar', label: '支出', data: rows.map(r => r.expense),
                            backgroundColor: shade('255,69,58'), borderRadius: 3,
                            categoryPercentage: 0.7, barPercentage: 0.9, order: 2
                        },
                        {
                            type: 'line', label: '収支', data: rows.map(r => r.net),
                            borderColor: '#eceef3', borderWidth: 1.5,
                            pointRadius: 2, pointBackgroundColor: '#eceef3',
                            pointHoverRadius: 4, tension: 0.25, order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    animation: { duration: 700, easing: 'easeOutQuart' },
                    plugins: {
                        legend: {
                            display: true, position: 'bottom',
                            labels: {
                                color: '#98989f', boxWidth: 8, boxHeight: 8,
                                usePointStyle: true, pointStyle: 'circle',
                                font: { size: 10 }, padding: 12
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(28,28,30,0.96)',
                            bodyColor: '#ffffff', titleColor: '#98989f',
                            borderColor: 'rgba(255,255,255,0.12)', borderWidth: 1,
                            padding: 10, cornerRadius: 10,
                            callbacks: {
                                title: (items) => {
                                    const p = months[items[0].dataIndex].split('/');
                                    return `${p[0]}年${Number(p[1])}月`;
                                },
                                label: (c) => ' ' + c.dataset.label + ' ' + yen(c.parsed.y)
                            }
                        }
                    },
                    scales: {
                        x: {
                            border: { display: false },
                            grid: { display: false },
                            ticks: {
                                font: { size: 10 }, maxRotation: 0,
                                color: (c) => c.index === selected ? '#ffffff' : '#98989f'
                            }
                        },
                        y: {
                            border: { display: false },
                            grid: { color: 'rgba(255,255,255,0.06)' },
                            ticks: {
                                color: '#98989f', font: { size: 10 }, padding: 4,
                                maxTicksLimit: 5, callback: (v) => formatMan(v)
                            }
                        }
                    }
                }
            });
        }

        function setCalendarMode(mode) {
            if (calendarMode === mode) return;
            calendarMode = mode;
            const list = (mode === 'month') ? monthList : yearList;
            currentSelection = list.length > 0 ? list[list.length - 1] : '';
            if (!currentSelection) {
                const now = new Date();
                currentSelection = (mode === 'month') ? formatDateYM(now) : now.getFullYear().toString();
            }
            renderKakeibo();
        }

        function switchTab(type) {
            if (currentTab === type) return;
            currentTab = type;
            document.getElementById('btn-expense').classList.toggle('active', type === '支出');
            document.getElementById('btn-income').classList.toggle('active', type === '収入');
            renderSummaryData();
        }

        function renderNav() {
            const nav = document.getElementById('date-nav');
            nav.innerHTML = '';
            let list = (calendarMode === 'month') ? monthList : yearList;

            if (list.length === 0) {
                const now = new Date();
                list = [(calendarMode === 'month') ? formatDateYM(now) : now.getFullYear().toString()];
            }

            list.forEach(val => {
                const span = document.createElement('span');
                if (calendarMode === 'month') {
                    const parts = val.split('/');
                    span.textContent = `${parts[0]}年${Number(parts[1])}月`;
                } else {
                    span.textContent = `${val}年`;
                }
                if (val === currentSelection) span.classList.add('active');
                span.onclick = () => {
                    if (currentSelection === val) return;
                    currentSelection = val;
                    nav.querySelectorAll('span').forEach(s => s.classList.remove('active'));
                    span.classList.add('active');
                    span.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    renderSummaryData();
                    renderMonthlyBars();
                };
                nav.appendChild(span);
            });

            const active = nav.querySelector('span.active');
            requestAnimationFrame(() => {
                if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });
                else nav.scrollLeft = nav.scrollWidth;
            });
        }

        function getPreviousPeriodKey(current, mode) {
            if (!current) return null;
            if (mode === 'month') {
                const parts = current.split('/');
                return formatDateYM(new Date(parseInt(parts[0]), parseInt(parts[1]) - 2, 1));
            }
            return (parseInt(current) - 1).toString();
        }

        function renderSummaryData() {
            const periodData = globalData.filter(d => d.date && d.date.startsWith(currentSelection));
            let totalIncome = 0, totalExpense = 0;
            periodData.forEach(d => {
                if (d.type === '収入') totalIncome += d.amount;
                else if (d.type === '支出') totalExpense += d.amount;
            });
            const net = totalIncome - totalExpense;

            animateValue('total-income', 0, totalIncome, 700, yen);
            animateValue('total-expense', 0, totalExpense, 700, yen);
            animateValue('total-balance', 0, net, 700, yen);
            document.getElementById('total-balance').style.color =
                net >= 0 ? 'var(--net-plus)' : 'var(--net-minus)';

            const prev = periodTotals(getPreviousPeriodKey(currentSelection, calendarMode));
            const diff = net - prev.net;
            const periodName = calendarMode === 'month' ? '前月比' : '前年比';
            document.getElementById('diff-balance').textContent = prev.count > 0
                ? `${periodName} ${diff >= 0 ? '+' : '-'}¥${Math.abs(diff).toLocaleString()}`
                : `${periodName} データなし`;

            const filtered = periodData.filter(d => d.type === currentTab);
            const listContainer = document.getElementById('category-list-container');

            if (filtered.length === 0) {
                currentCategories = [];
                listContainer.innerHTML = '<div class="no-data">データがありません</div>';
                drawDoughnut([], [], []);
                return;
            }

            currentCategories = groupByCategory(filtered, currentTab);

            const targetTotal = currentTab === '収入' ? totalIncome : totalExpense;
            const labels = [], values = [], colors = [];

            listContainer.innerHTML = currentCategories.map((cat, index) => {
                const color = getColorForCategory(cat.name, index);
                labels.push(cat.name);
                values.push(cat.data.total);
                colors.push(color);

                const percent = targetTotal > 0 ? (cat.data.total / targetTotal * 100).toFixed(1) : '0.0';
                const subsHtml = Object.keys(cat.data.subs).map(sub => `
                    <div class="sub-item">
                        <span>${escapeHtml(sub)}</span>
                        <span>${yen(cat.data.subs[sub])}</span>
                    </div>`).join('');

                return `
                <div class="category-item animate-in" style="animation-delay:${(index * 0.06).toFixed(2)}s" data-cat="${index}">
                    <div class="cat-header">
                        <div class="icon-box" style="background-color:${color}">
                            <i class="fa-solid ${getIconClass(cat.name)}"></i>
                        </div>
                        <div class="cat-info"><div class="cat-name">${escapeHtml(cat.name)}</div></div>
                        <div>
                            <div class="cat-total">${yen(cat.data.total)}</div>
                            <div class="cat-percent-val">${percent}%</div>
                        </div>
                    </div>
                    <div class="sub-list">${subsHtml}</div>
                </div>`;
            }).join('');

            listContainer.querySelectorAll('.category-item').forEach(el => {
                el.onclick = () => {
                    const cat = currentCategories[Number(el.dataset.cat)];
                    if (cat) showDetailView(cat.name);
                };
            });

            drawDoughnut(labels, values, colors);
        }

        function drawDoughnut(labels, data, colors) {
            if (doughnutChart) { doughnutChart.destroy(); doughnutChart = null; }
            doughnutChart = makeDoughnut('doughnutChart', labels, data, colors);
        }

        /* カテゴリ詳細 */

        function isDetailOpen() {
            return document.getElementById('detail-sheet').classList.contains('open');
        }

        function openSheetEl() {
            document.getElementById('detail-sheet').classList.add('open');
            document.body.classList.add('sheet-open');
        }

        function setSheetFoot(html) {
            const foot = document.getElementById('sheet-foot');
            foot.innerHTML = html || '';
            foot.style.display = html ? 'block' : 'none';
        }

        function openSheet(title, html, context, footHtml) {
            sheetContext = context || null;
            document.getElementById('detail-category-title').textContent = title;
            const body = document.getElementById('detail-list-content');
            body.innerHTML = html;
            body.scrollTop = 0;
            setSheetFoot(footHtml);
            openSheetEl();
        }

        function showDetailView(categoryName) {
            currentDetailCategory = categoryName;
            sheetContext = { type: 'category', name: categoryName };
            renderDetailList(categoryName);
            setSheetFoot('');
            openSheetEl();
        }

        function openKakeiboFor(month, tab) {
            calendarMode = 'month';
            currentSelection = month;
            if (tab) currentTab = tab;
            showScreen('kakeibo');
        }

        function closeDetailView() {
            document.getElementById('detail-sheet').classList.remove('open');
            document.body.classList.remove('sheet-open');
            sheetContext = null;
        }

        // ポップアップを開いたままデータが更新されたときに中身を作り直す
        function refreshSheet() {
            if (!sheetContext) return;
            if (sheetContext.type === 'category') renderDetailList(sheetContext.name);
            else if (sheetContext.type === 'breakdown') showMonthBreakdown(sheetContext.kind);
        }

        function kakeiboButton(month, monthLabel, tab) {
            return `<button class="sheet-action" onclick="openKakeiboFor('${month}','${tab}')">
                        家計簿で${monthLabel}を見る <i class="fa-solid fa-chevron-right"></i>
                    </button>`;
        }

        function showMonthBreakdown(kind) {
            const month = monthList.length ? monthList[monthList.length - 1] : formatDateYM(new Date());
            const p = month.split('/');
            const monthLabel = `${p[0]}年${Number(p[1])}月`;
            const totals = periodTotals(month);
            const prev = periodTotals(getPreviousPeriodKey(month, 'month'));
            const ctx = { type: 'breakdown', kind };

            if (kind === 'net') {
                const paceInfo = monthlyPace(PACE_MONTHS);
                const rows = [
                    ['収入', yen(totals.income), 'pos'],
                    ['支出', yen(totals.expense), 'neg'],
                    ['収支', signedYen(totals.net), totals.net >= 0 ? 'pos' : 'neg']
                ];
                if (totals.income > 0) {
                    const rate = totals.net / totals.income * 100;
                    rows.push(['貯蓄率', rate.toFixed(1) + '%', rate >= 0 ? 'pos' : 'neg']);
                }
                if (prev.count > 0) {
                    const d = totals.net - prev.net;
                    rows.push(['前月比', signedYen(d), d >= 0 ? 'pos' : 'neg']);
                }
                rows.push([`直近${paceInfo.months}ヶ月の平均`, signedYen(paceInfo.pace),
                        paceInfo.pace >= 0 ? 'pos' : 'neg']);
                const vsAvg = totals.net - paceInfo.pace;
                rows.push(['平均との差', signedYen(vsAvg), vsAvg >= 0 ? 'pos' : 'neg']);

                openSheet(`${monthLabel}の収支`, `<div class="sheet-section">${kvRows(rows)}</div>`,
                        ctx, kakeiboButton(month, monthLabel, ''));
                return;
            }

            const total = kind === '収入' ? totals.income : totals.expense;
            const prevTotal = kind === '収入' ? prev.income : prev.expense;
            const entries = globalData.filter(d => d.date && d.date.startsWith(month) && d.type === kind);
            const cats = groupByCategory(entries, kind);

            const summary = [['合計', yen(total)], ['件数', entries.length + '件']];
            if (prev.count > 0) {
                const diff = total - prevTotal;
                const good = kind === '収入' ? diff >= 0 : diff <= 0;
                summary.push(['前月比', signedYen(diff), good ? 'pos' : 'neg']);
            }
            if (cats.length > 0 && total > 0) {
                const top = cats[0];
                summary.push(['最も大きい項目',
                    `${top.name}（${(top.data.total / total * 100).toFixed(0)}%）`]);
            }

            const list = cats.length === 0
                ? '<div class="no-data">データがありません</div>'
                : cats.map((c, i) => {
                    const pct = total > 0 ? (c.data.total / total * 100) : 0;
                    const color = getColorForCategory(c.name, i, kind);
                    return `
                    <div class="bd-row">
                        <div class="bd-line">
                            <span class="bd-name">${escapeHtml(c.name)}</span>
                            <span class="bd-amount">${yen(c.data.total)}<em>${pct.toFixed(1)}%</em></span>
                        </div>
                        <div class="bd-bar"><i style="width:${pct.toFixed(1)}%;background:${color}"></i></div>
                    </div>`;
                }).join('');

            openSheet(`${monthLabel}の${kind}`,
                `<div class="sheet-section">${kvRows(summary)}</div>
                <div class="sheet-section bd-list">${list}</div>`,
                ctx, kakeiboButton(month, monthLabel, kind));
        }

        function onSheetBackdrop(event) {
            if (event.target === event.currentTarget) closeDetailView();
        }

        function renderDetailList(categoryName) {
            document.getElementById('detail-category-title').textContent = categoryName;
            const listEl = document.getElementById('detail-list-content');

            const filtered = globalData.filter(d => {
                if (!d.date || !d.date.startsWith(currentSelection)) return false;
                if (d.type !== currentTab) return false;
                const parts = d.category ? d.category.split('/') : ['未分類', 'その他'];
                const mainCat = parts[0].trim();
                const subCat = parts.length > 1 ? parts[1].trim() : 'その他';
                return ((currentTab === '収入') ? subCat : mainCat) === categoryName;
            }).sort((a, b) => b.date.localeCompare(a.date));

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="no-data">データがありません</div>';
                return;
            }

            const color = (currentTab === '収入') ? 'var(--income)' : 'var(--expense)';
            listEl.innerHTML = filtered.map((d, i) => `
                <div class="tx-row" style="animation-delay:${(i * 0.03).toFixed(2)}s">
                    <div class="tx-main">
                        <div class="tx-desc">${escapeHtml(d.description)}</div>
                        <div class="tx-meta">${escapeHtml(d.date)}</div>
                    </div>
                    <div class="tx-amount" style="color:${color}">${yen(d.amount)}</div>
                </div>`).join('');
        }

        /* 目標 */

        function loadGoal() {
            try { return JSON.parse(localStorage.getItem(GOAL_KEY)) || {}; }
            catch (e) { return {}; }
        }

        function onGoalInput() {
            const amount = Number(document.getElementById('goal-amount').value) || 0;
            const month = document.getElementById('goal-month').value || '';
            localStorage.setItem(GOAL_KEY, JSON.stringify({ amount, month }));
            renderGoalResult();
        }

        // 直近 n ヶ月の平均月次収支＝現在の貯蓄ペース
        function monthlyPace(n) {
            const months = monthList.slice(-n);
            if (months.length === 0) return { pace: 0, months: 0 };
            const total = months.reduce((s, m) => s + periodTotals(m).net, 0);
            return { pace: Math.round(total / months.length), months: months.length };
        }

        function monthsUntil(targetMonth) {
            const parts = targetMonth.split('-').map(Number);
            const now = new Date();
            return (parts[0] - now.getFullYear()) * 12 + (parts[1] - (now.getMonth() + 1));
        }

        function monthLabelAfter(count) {
            const d = new Date();
            d.setMonth(d.getMonth() + count);
            return `${d.getFullYear()}年${d.getMonth() + 1}月`;
        }

        function signedYen(v) {
            return (v >= 0 ? '+' : '-') + yen(Math.abs(Math.round(v)));
        }

        function renderGoal() {
            const goal = loadGoal();
            const amountEl = document.getElementById('goal-amount');
            const monthEl = document.getElementById('goal-month');
            // 入力中の値を上書きしない
            if (document.activeElement !== amountEl) amountEl.value = goal.amount || '';
            if (document.activeElement !== monthEl) monthEl.value = goal.month || '';
            animateValue('goal-balance', 0, currentBalance(), 800, yen);
            renderGoalResult();
        }

        function kvRows(rows) {
            return rows.map(r =>
                `<div class="kv"><span>${r[0]}</span><span class="${r[2] || ''}">${r[1]}</span></div>`
            ).join('');
        }

        function renderGoalResult() {
            const goal = loadGoal();
            const balance = currentBalance();
            const resultEl = document.getElementById('goal-result');
            const textEl = document.getElementById('goal-progress-text');
            const barEl = document.getElementById('goal-progress-bar');

            if (!goal.amount || goal.amount <= 0) {
                textEl.textContent = '目標を設定してください';
                barEl.style.width = '0%';
                resultEl.innerHTML = '';
                return;
            }

            const remaining = goal.amount - balance;
            const ratio = Math.max(0, Math.min(100, balance / goal.amount * 100));
            barEl.style.width = ratio.toFixed(1) + '%';
            textEl.textContent = `目標 ${yen(goal.amount)} の ${ratio.toFixed(1)}%`;

            if (remaining <= 0) {
                resultEl.innerHTML = `
                    <div class="card card-mt">
                        <div class="verdict ok">目標を達成しています</div>
                        ${kvRows([['目標を超えた分', signedYen(-remaining), 'pos']])}
                    </div>`;
                return;
            }

            const paceInfo = monthlyPace(PACE_MONTHS);
            const pace = paceInfo.pace;
            const note = `<div class="kv-note">直近${paceInfo.months}ヶ月の平均収支から算出</div>`;

            // 時期を決めている場合は「必要なペース」と間に合うかを出す
            if (goal.month && monthsUntil(goal.month) > 0) {
                const left = monthsUntil(goal.month);
                const required = Math.ceil(remaining / left);
                const projected = balance + pace * left;
                const gap = projected - goal.amount;
                const ok = gap >= 0;

                resultEl.innerHTML = `
                    <div class="card card-mt">
                        <div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '今のペースで間に合う見込みです' : '今のペースでは届きません'}</div>
                        ${kvRows([
                            ['目標まで', yen(remaining)],
                            ['残り期間', `${left}ヶ月`],
                            ['必要なペース', `月 ${yen(required)}`],
                            ['現在のペース', `月 ${signedYen(pace)}`, pace >= 0 ? 'pos' : 'neg'],
                            [ok ? '毎月の余裕' : '毎月の不足', signedYen(gap / left), ok ? 'pos' : 'neg'],
                            ['到達見込み額', yen(Math.round(projected)), ok ? 'pos' : 'neg']
                        ])}
                        ${note}
                    </div>`;
                return;
            }

            const expired = goal.month && monthsUntil(goal.month) <= 0;
            const rows = [['目標まで', yen(remaining)]];
            if (expired) rows.push(['設定した時期', '過ぎています', 'neg']);
            rows.push(['現在のペース', `月 ${signedYen(pace)}`, pace >= 0 ? 'pos' : 'neg']);
            rows.push(pace > 0
                ? ['到達見込み', `${monthLabelAfter(Math.ceil(remaining / pace))}ごろ`]
                : ['到達見込み', '現在のペースでは到達しません', 'neg']);

            resultEl.innerHTML = `
                <div class="card card-mt">
                    ${kvRows(rows)}
                    ${note}
                </div>`;
        }

        /* 資産 */

        const RANGE_SPEC = {
            '1m':  { months: 1 },
            '3m':  { months: 3 },
            '1y':  { months: 12 },
            'all': { months: 0 }
        };

        function setAssetRange(mode) {
            if (assetRange === mode) return;
            assetRange = mode;
            document.querySelectorAll('#range-seg .seg-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.range === mode);
            });
            renderAssets();
        }

        function countPointsInRange(series, mode) {
            const spec = RANGE_SPEC[mode] || RANGE_SPEC['3m'];
            if (!spec.months || series.labels.length === 0) return series.labels.length;

            const last = series.labels[series.labels.length - 1].split('/');
            const cutoff = new Date(Number(last[0]), Number(last[1]) - 1 - spec.months, Number(last[2]));
            const cutoffKey = cutoff.getFullYear() + '/' +
                String(cutoff.getMonth() + 1).padStart(2, '0') + '/' +
                String(cutoff.getDate()).padStart(2, '0');

            let count = 0;
            for (let i = series.labels.length - 1; i >= 0; i--) {
                if (series.labels[i] < cutoffKey) break;
                count++;
            }
            return Math.min(series.labels.length, Math.max(count, 2));
        }

        function renderAssets() {
            const full = buildDailyBalanceSeries();
            const balance = full.values.length ? full.values[full.values.length - 1] : INITIAL_BALANCE;
            animateValue('assets-balance', 0, balance, 800, yen);

            assetSeries = full;
            assetVisible = Math.max(2, Math.min(full.labels.length, countPointsInRange(full, assetRange)));
            const startIndex = Math.max(0, full.values.length - assetVisible);

            const sub = document.getElementById('assets-balance-sub');
            if (full.labels.length > 1) {
                const diff = balance - full.values[startIndex];
                sub.textContent = `${full.labels[startIndex]} 以降 ${diff >= 0 ? '+' : '-'}¥${Math.abs(diff).toLocaleString()}`;
            } else {
                sub.textContent = '記録がありません';
            }
            setupTrendChart();
        }

        function setupTrendChart() {
            const sc = document.getElementById('trendScrollContainer');
            const track = document.getElementById('chartTrack');
            const wrapper = document.getElementById('lineChartWrapper');
            if (!sc || !wrapper.offsetParent) return;

            const containerWidth = sc.clientWidth || 320;
            const total = assetSeries.labels.length;

            wrapper.style.width = containerWidth + 'px';
            track.style.width = Math.round(containerWidth * Math.max(1, total / assetVisible)) + 'px';

            assetWindowStart = Math.max(0, total - assetVisible);
            drawLineChart(containerWidth);

            requestAnimationFrame(() => { sc.scrollLeft = sc.scrollWidth; });
        }

        function trendLabelAt(index) {
            const d = assetSeries.labels[index];
            if (!d) return '';
            const p = d.split('/');
            if (p.length !== 3) return d;
            const longSpan = (assetRange === '1y' || assetRange === 'all');
            return longSpan ? `${p[0].slice(2)}/${Number(p[1])}` : `${Number(p[1])}/${Number(p[2])}`;
        }

        function onTrendScroll() {
            if (!lineChart || trendScrollRaf) return;
            trendScrollRaf = requestAnimationFrame(() => {
                trendScrollRaf = null;
                const sc = document.getElementById('trendScrollContainer');
                const maxStart = Math.max(0, assetSeries.labels.length - assetVisible);
                const maxScroll = Math.max(1, sc.scrollWidth - sc.clientWidth);
                const start = Math.min(maxStart, (sc.scrollLeft / maxScroll) * maxStart);
                if (Math.abs(start - assetWindowStart) < 0.01) return;
                assetWindowStart = start;
                lineChart.options.scales.x.min = start;
                lineChart.options.scales.x.max = start + assetVisible - 1;
                lineChart.update('none');
            });
        }

        const AXIS_STEP = 200000;
        const AXIS_DEFAULT_MAX = 1000000;

        function axisRange(values) {
            if (!values.length) return { min: 0, max: AXIS_DEFAULT_MAX, step: AXIS_STEP };
            const minV = Math.min(...values, 0);
            const maxV = Math.max(...values, 0);
            return {
                min: Math.min(0, Math.floor(minV / AXIS_STEP) * AXIS_STEP),
                max: Math.max(AXIS_DEFAULT_MAX, Math.ceil(maxV / AXIS_STEP) * AXIS_STEP),
                step: AXIS_STEP
            };
        }

        // 金額を「◯万 / ◯億」表記にして縦軸の占有幅を抑える
        function formatMan(v) {
            if (v === 0) return '0';
            const abs = Math.abs(v);
            const round = (n) => Math.abs(n) >= 10 ? Math.round(n) : Math.round(n * 100) / 100;
            if (abs >= 100000000) return round(v / 100000000) + '億';
            if (abs >= 10000) return round(v / 10000) + '万';
            return v.toLocaleString();
        }

        function drawLineChart(containerWidth) {
            const canvas = document.getElementById('lineChart');
            if (!canvas || !canvas.offsetParent) return;

            const yAxis = axisRange(assetSeries.values);
            const points = assetSeries.values.map((v, i) => ({ x: i, y: v }));

            const tickCount = Math.min(6, Math.max(3, Math.round(containerWidth / 70)));

            if (lineChart) { lineChart.destroy(); lineChart = null; }

            const areaGradient = (context) => {
                const chart = context.chart;
                const area = chart.chartArea;
                if (!area) return 'rgba(10,132,255,0.18)';
                const g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
                g.addColorStop(0, 'rgba(10,132,255,0.28)');
                g.addColorStop(1, 'rgba(10,132,255,0)');
                return g;
            };

            lineChart = new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: {
                    datasets: [{
                        label: '資産残高',
                        data: points,
                        borderColor: '#0a84ff',
                        backgroundColor: areaGradient,
                        borderWidth: 2,
                        pointBackgroundColor: '#0a84ff',
                        pointBorderColor: '#1c1c1e',
                        pointBorderWidth: 2,
                        pointRadius: assetVisible > 30 ? 0 : 3,
                        pointHitRadius: 12,
                        pointHoverRadius: 5,
                        fill: 'start',
                        tension: 0.25
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    parsing: false,
                    normalized: true,
                    interaction: { mode: 'index', intersect: false },
                    animation: { duration: 900, easing: 'easeOutQuart' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(28,28,30,0.96)',
                            bodyColor: '#ffffff',
                            titleColor: '#98989f',
                            borderColor: 'rgba(255,255,255,0.12)',
                            borderWidth: 1,
                            padding: 10, cornerRadius: 10, displayColors: false,
                            callbacks: {
                                title: (items) => assetSeries.labels[Math.round(items[0].parsed.x)] || '',
                                label: (c) => ' 残高 ' + yen(c.parsed.y)
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: assetWindowStart,
                            max: assetWindowStart + assetVisible - 1,
                            border: { display: false },
                            grid: { display: false },
                            ticks: {
                                color: '#98989f', font: { size: 10 },
                                maxRotation: 0, autoSkip: false, count: tickCount,
                                callback: (value) => trendLabelAt(Math.round(value))
                            }
                        },
                        y: {
                            position: 'right',
                            min: yAxis.min,
                            max: yAxis.max,
                            border: { display: false },
                            grid: { color: 'rgba(255,255,255,0.06)' },
                            ticks: {
                                color: '#98989f', font: { size: 10 }, padding: 4,
                                stepSize: yAxis.step,
                                callback: (v) => formatMan(v)
                            }
                        }
                    }
                }
            });
        }

        /* 初期化 */

        document.getElementById('trendScrollContainer').addEventListener('scroll', onTrendScroll, { passive: true });
        document.getElementById('goal-amount').addEventListener('input', onGoalInput);
        document.getElementById('goal-month').addEventListener('change', onGoalInput);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isDetailOpen()) closeDetailView();
        });

        showScreen('home');

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .catch((err) => console.log('ServiceWorker 登録失敗:', err));
            });
        }
        </script>
    </body>
</html>
